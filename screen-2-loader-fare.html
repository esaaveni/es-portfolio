<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .screen { width: 375px; height: 812px; background: white; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #1a1a4d 0%, #2d2d6b 100%); color: white; padding: 16px; display: flex; align-items: center; justify-content: space-between; height: 56px; font-weight: 600; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 60px; height: 60px; margin-bottom: 30px; }
    .spinner-ring { width: 60px; height: 60px; border: 4px solid #f0f0f0; border-top: 4px solid #e11b23; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .text { font-size: 16px; color: #1a1a1a; text-align: center; padding: 0 40px; }
  </style>
</head>
<body>
<div class="screen">
  <div class="header">
    <div>LATAM</div>
    <button style="border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; background: transparent;">Usuario ▼</button>
  </div>
  <div class="content">
    <div class="spinner"><div class="spinner-ring"></div></div>
    <div class="text">Cargando condiciones de tarifa...</div>
  </div>
</div>
</body>
</html>
